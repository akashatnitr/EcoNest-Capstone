<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">EcoNest workflow</title>
  <desc id="desc">A trigger reaches the EcoNest Orchestrator, which routes to a specialist agent and the MCP data layer. Read-only requests return a grounded answer. Device actions pass a safety gate before a Home Assistant service call. Both paths create an audit record and user-facing result.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#5f6368"/></marker>
    <style>
      .box { fill:#fff; stroke:#9aa0a6; stroke-width:1.3; rx:6; }
      .decision { fill:#fff; stroke:#9aa0a6; stroke-width:1.3; }
      .line { stroke:#5f6368; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
      .label { font: 20px Arial, sans-serif; fill:#202124; }
      .small { font: 13px Arial, sans-serif; fill:#202124; }
      .center { text-anchor:middle; }
    </style>
  </defs>
  <rect width="1120" height="680" fill="white"/>

  <rect class="box" x="16" y="20" width="192" height="86"/>
  <text class="label" x="28" y="41">Trigger</text>
  <text class="label" x="28" y="61">(User prompt,</text>
  <text class="label" x="28" y="81">schedule, sensor event,</text>
  <text class="label" x="28" y="101">Home Assistant event)</text>

  <rect class="box" x="258" y="20" width="141" height="86"/>
  <text class="label" x="270" y="42">EcoNest</text>
  <text class="label" x="270" y="63">Orchestrator</text>

  <rect class="box" x="544" y="20" width="142" height="86"/>
  <text class="label" x="556" y="42">Specialist agent</text>

  <rect class="box" x="760" y="20" width="162" height="86"/>
  <text class="label" x="772" y="42">MCP Data Layer</text>

  <path class="line" d="M208 63 H258"/>
  <path class="line" d="M399 63 H544"/>
  <text class="small" x="416" y="57">Routes request to the</text>
  <text class="small" x="416" y="72">appropriate agent</text>
  <path class="line" d="M686 63 H760"/>

  <path class="line" d="M841 106 V194"/>
  <text class="small" x="852" y="135">Reads live Home Assistant state,</text>
  <text class="small" x="852" y="150">retained history, weather, and</text>
  <text class="small" x="852" y="165">device capabilities</text>

  <polygon class="decision" points="841,194 920,231 841,268 762,231"/>
  <text class="label center" x="841" y="238">Request type?</text>

  <rect class="box" x="430" y="198" width="138" height="68"/>
  <text class="label center" x="499" y="221">Return grounded</text>
  <text class="label center" x="499" y="243">answer / advisory</text>
  <path class="line" d="M762 231 H568"/>
  <text class="label center" x="660" y="223">Read-only question</text>
  <text class="label center" x="660" y="244">or recommendation</text>

  <path class="line" d="M841 268 V313"/>
  <text class="label center" x="841" y="293">Action requested</text>
  <rect class="box" x="765" y="313" width="152" height="78"/>
  <text class="label center" x="841" y="337">Safety Gate:</text>
  <text class="label center" x="841" y="355">permission, capability,</text>
  <text class="label center" x="841" y="373">state, confirmation</text>

  <path class="line" d="M841 391 V451"/>
  <rect class="box" x="778" y="451" width="126" height="63"/>
  <text class="label center" x="841" y="475">Home Assistant</text>
  <text class="label center" x="841" y="496">service call</text>

  <path class="line" d="M841 514 V565"/>
  <path class="line" d="M499 266 V596 H778"/>
  <rect class="box" x="778" y="565" width="126" height="64"/>
  <text class="label center" x="841" y="587">Audit record +</text>
  <text class="label center" x="841" y="608">user-facing result</text>
</svg>
