<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EcoNest Home Snapshot</title>
  <link rel="stylesheet" href="/static/econest-theme.css">
  <style>
    body {
      margin: 0;
      padding: 28px;
      background: #f7f2e8;
      color: #292823;
      font-family: Inter, system-ui, sans-serif;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: #6f5237;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .1em;
      margin: 0 0 6px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -.04em;
    }

    .subtitle {
      color: #69655b;
      margin: 7px 0 0;
    }

    button {
      border: 1px solid #8fa687;
      border-radius: 9px;
      background: #b6c7ad;
      color: #263327;
      font-weight: 800;
      padding: 9px 13px;
      cursor: pointer;
    }

    .status {
      color: #69655b;
      font-size: .82rem;
      margin-top: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      border: 1px solid #ded7c8;
      border-radius: 15px;
      background: #fffdfa;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(88, 73, 45, .08);
    }

    .card-label {
      color: #777166;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .card-value {
      margin-top: 8px;
      font-size: 1.45rem;
      font-weight: 850;
    }

    .section {
      margin-top: 20px;
    }

    .section h2 {
      font-size: 1.05rem;
      margin: 0 0 10px;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      border: 1px solid #e2dccf;
      border-radius: 11px;
      background: #fffdfa;
      padding: 12px 14px;
    }

    .item strong {
      display: block;
      font-size: .9rem;
    }

    .item span {
      color: #777166;
      font-size: .78rem;
    }

    .empty {
      color: #777166;
      border: 1px dashed #cfc6b5;
      border-radius: 11px;
      padding: 15px;
      background: #fbf8f1;
    }

    @media (max-width: 900px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .items { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      body { padding: 18px; }
      .header { flex-direction: column; }
      .cards { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <p class="eyebrow">ECONEST / HOME SNAPSHOT</p>
      <h1>Home at a glance</h1>
      <p class="subtitle">A compact view of the current Home Assistant state.</p>
      <div id="status" class="status">Loading current state…</div>
    </div>
    <button type="button" onclick="loadSnapshot()">Refresh</button>
  </header>

  <section class="cards">
    <article class="card">
      <div class="card-label">Occupancy</div>
      <div id="occupancy" class="card-value">—</div>
    </article>

    <article class="card">
      <div class="card-label">Lights on</div>
      <div id="lights" class="card-value">—</div>
    </article>

    <article class="card">
      <div class="card-label">Switches on</div>
      <div id="switches" class="card-value">—</div>
    </article>

    <article class="card">
      <div class="card-label">Active motion</div>
      <div id="motion" class="card-value">—</div>
    </article>
  </section>

  <section class="section">
    <h2>People</h2>
    <div id="people" class="items"></div>
  </section>

  <section class="section">
    <h2>Lights currently on</h2>
    <div id="lightsList" class="items"></div>
  </section>

  <section class="section">
    <h2>Switches currently on</h2>
    <div id="switchesList" class="items"></div>
  </section>

  <section class="section">
    <h2>Open covers</h2>
    <div id="covers" class="items"></div>
  </section>

  <section class="section">
    <h2>Current power</h2>
    <div id="power" class="items"></div>
  </section>

  <section class="section">
    <h2>Energy today</h2>
    <div id="energy" class="items"></div>
  </section>

  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderItems(id, items, suffix = "") {
      const target = document.getElementById(id);

      if (!items || items.length === 0) {
        target.innerHTML = '<div class="empty">Nothing to show.</div>';
        return;
      }

      target.innerHTML = items.map(item => `
        <div class="item">
          <strong>${escapeHtml(item.name || item.entity_id)}</strong>
          <span>${escapeHtml(item.state ?? "")}${suffix}</span>
        </div>
      `).join("");
    }

    async function loadSnapshot() {
      const status = document.getElementById("status");
      status.textContent = "Refreshing current state…";

      try {
        const response = await fetch("/home/snapshot", { cache: "no-store" });
        const data = await response.json();

        if (!data.available) {
          status.textContent = (data.warnings || ["Home Assistant unavailable"]).join(" ");
          return;
        }

        document.getElementById("occupancy").textContent =
          data.occupancy_status || "unknown";

        document.getElementById("lights").textContent =
          (data.lights_on || []).length;

        document.getElementById("switches").textContent =
          (data.switches_on || []).length;

        document.getElementById("motion").textContent =
          (data.active_motion || []).length;

        renderItems("people", data.people);
        renderItems("lightsList", data.lights_on);
        renderItems("switchesList", data.switches_on);
        renderItems("covers", data.covers_open);
        renderItems("power", data.top_power_now_w, " W");
        renderItems("energy", data.top_energy_today_kwh, " kWh");

        status.textContent =
          `Live snapshot • ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        status.textContent = "Unable to load the Home Assistant snapshot.";
        console.error(error);
      }
    }

    loadSnapshot();
    setInterval(loadSnapshot, 30000);
  </script>
</body>
</html>
