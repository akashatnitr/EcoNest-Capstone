<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/econest-theme.css"><style>body{margin:0;background:#f7f2e8;color:#292823;font-family:Inter,system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:42px 28px}.eyebrow{color:#6f5237;font-size:.76rem;font-weight:800;letter-spacing:.1em}h1{font-size:2.4rem;margin:7px 0}.hint{color:#69655b}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:24px}.column,.card{padding:19px;border:1px solid #ded7c8;border-radius:16px;background:#fffdfa;box-shadow:0 12px 32px #58492d1a}.item{margin-top:10px;padding:13px;border-left:4px solid #789171;background:#f2f7ee;line-height:1.45}.actions{display:flex;gap:10px;margin:20px 0}.actions button{padding:10px 14px;border:1px solid #8fa687;border-radius:9px;background:#b6c7ad;color:#263327;font:inherit;font-weight:800;cursor:pointer}@media(max-width:760px){.board{grid-template-columns:1fr}}</style></head><body><main><p class="eyebrow">ECONEST / RECOMMENDATION ACTIVITY</p><h1>Autonomous actions</h1><p class="hint">Dataset-calibrated simulated household. Actions are advisory or virtual only.</p><div class="actions"><button id="advance">Advance simulated time 10 min</button><button id="refresh">Refresh activity</button></div><section class="card"><h2>Agent action board</h2><p id="context" class="hint">Loading simulated state…</p><div class="board"><section class="column"><h3>Active</h3><div id="active"></div></section><section class="column"><h3>Pending</h3><p class="hint">No external actions. Confirmation is always required for virtual device changes.</p></section><section class="column"><h3>Completed / advisory</h3><div id="completed"></div></section></div></section></main><script>
let id;async function load(){const a=await fetch('/auth/active-household');id=(await a.json()).id;const r=await fetch('/simulation/recommendations?household_id='+id);const d=await r.json(),s=d.state,l=s.live_simulation||{};document.querySelector('#context').textContent=`Simulated now: ${l.clock} · activity: ${l.activity} · occupancy: ${s.summary.occupancy}.`;document.querySelector('#active').innerHTML=s.summary.active_rooms?'<div class="item">Occupancy inference is active in '+s.summary.active_rooms+' room(s), using the current CASAS-inspired sensor pattern.</div>':'<p class="hint">No occupied rooms inferred.</p>';document.querySelector('#completed').innerHTML=d.recommendations.map(x=>'<div class="item"><strong>'+x.kind.toUpperCase()+' · '+x.title+'</strong><br>'+x.detail+'</div>').join('')}async function event(action){await fetch('/simulation/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,household_id:id})});load()}document.querySelector('#advance').onclick=()=>event('advance_ten_minutes');document.querySelector('#refresh').onclick=load;load();
</script></body></html>
