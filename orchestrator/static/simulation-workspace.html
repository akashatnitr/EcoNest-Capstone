<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EcoNest Dataset Workspace</title><link rel="stylesheet" href="/static/econest-theme.css"><style>
*{box-sizing:border-box}body{margin:0;color:#292823;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f7f2e8}main{max-width:1050px;margin:0 auto;padding:38px 26px}.eyebrow{color:#6f5237;font-size:.76rem;font-weight:800;letter-spacing:.1em}h1{margin:7px 0;font-size:clamp(1.8rem,3.5vw,2.7rem)}.intro{max-width:780px;color:#69655b;line-height:1.55}.card{margin-top:22px;padding:22px;border:1px solid #ded7c8;border-radius:16px;background:#fffdfa;box-shadow:0 12px 32px rgba(76,62,111,.09)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{padding:15px;border:1px solid #e4dbca;border-radius:11px;background:#faf8f2}.stat span{display:block;color:#69655b;font-size:.78rem}.stat strong{display:block;margin-top:5px;font-size:1.05rem}ul{padding-left:20px;color:#575248;line-height:1.55}.note{border-left:4px solid #789171;padding:10px 13px;background:#f2f7ee;color:#435440}.tag{display:inline-block;margin:4px 5px 0 0;padding:5px 8px;border-radius:99px;background:#eee6d6;color:#5e4933;font-size:.8rem}
</style></head><body><main id="app"><section class="card">Loading dataset workspace…</section></main><script>
const feature=new URLSearchParams(location.search).get("feature")||"dataset";
const config={
command:{title:"Dataset prompts",lead:"Ask questions about the recorded CASAS Aruba sensor stream. Commands are advisory and never contact a real device.",body:"Try: ‘Which sensors were active during Bed_to_Toilet?’ or ‘Summarize the bedroom activity window.’"},
autonomy:{title:"Dataset recommendations",lead:"Recommendations are derived from the replayed occupancy and sensor context, not the connected home.",body:"Current replay: preserve privacy by treating M003/M004/M005/M007 as an occupancy transition, not a command to change any device."},
benchmarks:{title:"Replay evaluation",lead:"Use this page to evaluate whether EcoNest interprets known sensor events and activity annotations correctly.",body:"Suggested evaluation: compare inferred active rooms and activity labels against the CASAS annotation for each replay window."},
analytics:{title:"CASAS activity insights",lead:"Patterns below come from the public Aruba dataset inventory and the selected labelled replay window.",body:"The selected window transitions from Sleeping to Bed_to_Toilet, with bedroom and bathroom motion evidence."},
activity:{title:"Dataset action board",lead:"This board records simulated, advisory agent decisions made against CASAS events only.",body:"No real-home action history is shown in this workspace."},
monitor:{title:"CASAS event explorer",lead:"The raw source contains timestamped sensor ID, value, and optional annotated activity records.",body:"The bundled replay starts with real records around 05:40 AM: Sleeping ends, then Bed_to_Toilet begins and ends."},
context:{title:"Dataset context",lead:"CASAS supplies ambient sensor and activity context; it has no Gmail, calendar, weather, or irrigation integration.",body:"The current context is the selected historical replay window, not an upcoming real-world event."},
mcp:{title:"Dataset capability audit",lead:"Only safe simulation capabilities are enabled for this household.",body:"Available: inspect replay state, inspect sensor inventory, and advance/reset simulation. Live device control is unavailable."},
home_assistant:{title:"No Home Assistant for this replay",lead:"This simulated household is intentionally dataset-only.",body:"The CASAS source predates this EcoNest installation and has no Home Assistant endpoint to embed."},
arcadedb:{title:"Dataset graph preview",lead:"The sensor-to-room inventory is represented in the simulation view without connecting to the real-home graph.",body:"Nodes: rooms, motion sensors, door contacts, temperature sensors, and annotated activities."},
schema:{title:"Dataset relationships",lead:"CASAS records connect timestamp → sensor → value → optional activity annotation.",body:"EcoNest maps sensor → room → inferred occupancy/activity so recommendations remain explainable."}
}[feature]||{title:"CASAS Aruba dataset workspace",lead:"A safe, dataset-backed EcoNest workspace.",body:"No connected-home data is available here."};
let activeHouseholdId;
async function load(){const active=await fetch('/auth/active-household',{cache:'no-store'});const h=active.ok?await active.json():null;activeHouseholdId=h?.id;const response=await fetch('/simulation/state?household_id='+encodeURIComponent(h?.id||''),{cache:'no-store'});if(!response.ok)throw Error();return response.json()}
async function recommendations(){const response=await fetch('/simulation/recommendations?household_id='+encodeURIComponent(activeHouseholdId||''),{cache:'no-store'});return response.ok?response.json():{recommendations:[]}}
async function act(action){await fetch('/simulation/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,household_id:activeHouseholdId})});render(await load())}
async function render(data){const overview=data.dataset_overview||{},recs=await recommendations(),live=data.live_simulation||{};const controls=(feature==='command'||feature==='autonomy')?`<section class="card"><h2>Virtual device controls</h2><p class="intro">These test controls are layered over the recorded CASAS evidence. They never affect a real device.</p><div class="grid"><button data-action="living_light_on">Turn on living-room light</button><button data-action="living_light_off">Turn off living-room light</button><button data-action="kitchen_light_on">Turn on kitchen light</button><button data-action="kitchen_light_off">Turn off kitchen light</button><button data-action="advance_ten_minutes">Advance simulated time 10 min</button></div></section>`:"";const recommendationsCard=(feature==='command'||feature==='autonomy'||feature==='analytics'||feature==='activity')?`<section class="card"><h2>Energy & security recommendations</h2>${recs.recommendations.map(item=>`<p class="note"><strong>${item.kind.toUpperCase()} · ${item.title}</strong><br>${item.detail}</p>`).join('')}</section>`:"";document.querySelector('#app').innerHTML=`<p class="eyebrow">ECONEST / CASAS ARUBA REPLAY</p><h1>${config.title}</h1><p class="intro">${config.lead}</p><section class="card"><p class="note"><strong>Simulation boundary:</strong> ${config.body}</p><div class="grid"><div class="stat"><span>Mode</span><strong>${live.mode||'Dataset replay'}</strong></div><div class="stat"><span>Simulated now</span><strong>${live.clock||'—'}</strong></div><div class="stat"><span>Inferred activity</span><strong>${live.activity||'—'}</strong></div><div class="stat"><span>Occupancy</span><strong>${data.summary.occupancy}</strong></div><div class="stat"><span>Active rooms</span><strong>${data.summary.active_rooms}</strong></div><div class="stat"><span>Sensor inventory</span><strong>${overview.sensors||data.devices.length+' sensors'}</strong></div></div></section>${controls}${recommendationsCard}<section class="card"><h2>Available data</h2><p class="intro">${overview.coverage||'Safe simulated household'}</p><p><span class="tag">${overview.events||'replay events'}</span><span class="tag">${data.source?.license||'simulation'}</span></p><h3>Annotated activities</h3><p class="intro">${overview.activities||'Activity labels are not available for this scenario.'}</p><h3>Current simulated-live evidence</h3><ul>${data.events.map(event=>`<li>${event}</li>`).join('')}</ul></section>`;document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>act(button.dataset.action)));}
load().then(render).catch(()=>{document.querySelector('#app').textContent='The dataset workspace could not be loaded.'});
</script></main></body></html>
