<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EcoNest</title>
  <link rel="stylesheet" href="/static/econest-theme.css">
  <style>
    body { display:grid; min-height:100vh; margin:0; place-items:center; padding:24px; background:radial-gradient(circle at top right,#dce7d7,transparent 34rem),#f7f2e8; }
    main { width:min(100%,460px); border:1px solid #ded7c8; border-radius:18px; background:#fffdfa; box-shadow:0 18px 44px #58492d1a; padding:32px; }
    .eyebrow { color:#6f5237; font-size:.76rem; font-weight:800; letter-spacing:.1em; margin:0 0 9px; }
    h1 { margin:0; font-size:2rem; letter-spacing:-.04em; } p { color:#69655b; line-height:1.5; }
    label { display:grid; gap:7px; margin-top:16px; color:#51493e; font-weight:700; } input, select { border:1px solid #cfc2ac; border-radius:9px; padding:11px; font:inherit; } .password-field { position:relative; display:block; } .password-field input { width:100%; box-sizing:border-box; padding-right:46px; } .password-toggle { position:absolute; top:50%; right:8px; width:auto; margin:0; transform:translateY(-50%); border:0; background:transparent; color:#58452f; padding:7px; font-size:1rem; line-height:1; } .password-toggle:hover, .password-toggle:focus-visible { background:#eee5d2; outline:2px solid #cdbf9f; outline-offset:1px; }
    button { width:100%; margin-top:22px; border:1px solid #8fa687; border-radius:9px; background:#b6c7ad; color:#263327; cursor:pointer; font:inherit; font-weight:800; padding:12px; }
    button:hover { background:#a9bda0; } .status { min-height:1.4em; color:#8a392e; margin:14px 0 0; }
    .secondary { margin-top:10px; background:#eee5d2; border-color:#d2c4ac; color:#58452f; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ECONEST / SECURE WORKSPACE</p>
    <h1>Sign in</h1>
    <p>Sign in to open the Launchpad for your household.</p>
    <form id="loginForm">
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <span class="password-field"><input id="password" type="password" autocomplete="current-password" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" title="Show password">👁</button></span></label>
      <button type="submit">Sign in</button>
    </form>
    <label>Household profile
      <select id="householdProfile">
        <option value="connected_home">Connected home</option>
        <option value="city_apartment">City apartment simulation</option>
        <option value="family_home">Family home simulation</option>
      </select>
    </label>
    <button id="register" class="secondary" type="button">Create homeowner account</button>
    <p id="status" class="status" role="status"></p>
  </main>
  <script>
    const status = document.querySelector("#status");
    const passwordInput = document.querySelector("#password");
    const next = new URLSearchParams(window.location.search).get("next") || "/launchpad";
    const fields = () => ({ email: document.querySelector("#email").value.trim(), password: document.querySelector("#password").value, householdProfile: document.querySelector("#householdProfile").value });
    async function body(response) { const text = await response.text(); try { return text ? JSON.parse(text) : {}; } catch { return {}; } }
    async function signIn() { const { email, password } = fields(); const response = await fetch("/auth/login", { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({username:email,password}) }); const data = await body(response); if (!response.ok) throw Error(data.detail || "Sign-in failed."); window.location.assign(next.startsWith("/") ? next : "/launchpad"); }
    document.querySelector("#loginForm").addEventListener("submit", async event => { event.preventDefault(); status.textContent = "Signing in…"; try { await signIn(); } catch (error) { status.textContent = error.message; } });
    document.querySelector("#togglePassword").addEventListener("click", event => { const visible = passwordInput.type === "text"; passwordInput.type = visible ? "password" : "text"; event.currentTarget.textContent = visible ? "👁" : "🙈"; event.currentTarget.setAttribute("aria-label", visible ? "Show password" : "Hide password"); event.currentTarget.title = visible ? "Show password" : "Hide password"; });
    document.querySelector("#register").addEventListener("click", async () => { const { email, password, householdProfile } = fields(); if (!email || !password) { status.textContent = "Enter an email and password first."; return; } status.textContent = "Creating account…"; try { const response = await fetch("/auth/register", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email,password,role:"homeowner",household_profile:householdProfile}) }); const data = await body(response); if (!response.ok) throw Error(data.detail || "Could not create account."); await signIn(); } catch (error) { status.textContent = error.message; } });
  </script>
</body>
</html>
