<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoNest Autonomy Activity</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#08130e;color:#eef8f1}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#19513b,#08130e 55%)}main{width:min(940px,calc(100% - 32px));margin:auto;padding:48px 0 80px}h1{margin:0;font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.04em}p{color:#bbd1c1;line-height:1.5}.card{margin-top:24px;padding:24px;border:1px solid #346149;border-radius:18px;background:rgba(10,29,20,.9)}button,a.button{border:0;border-radius:9px;padding:11px 15px;background:#63e69d;color:#062113;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.secondary{background:#244b37;color:#e0f4e7}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.status{color:#a9cbb5;font-size:.9rem}.list{display:grid;gap:14px;margin-top:16px}.item{border:1px solid #2c5940;border-radius:12px;padding:17px;background:#0c2518}.item h2{margin:0;font-size:1.15rem}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tag{padding:4px 8px;border-radius:999px;background:#193e2a;color:#cef5da;font-size:.82rem}.confidence{background:#163f51;color:#c8efff}.outcome{margin:14px 0 0;padding:12px;border-left:4px solid #6d93a5;background:#102a22;border-radius:8px}.outcome.success{border-color:#63e69d}.outcome.failed{border-color:#ff7f87;background:#32191d}.outcome.skipped{border-color:#ffc45c;background:#33260e}.outcome h3{margin:0;color:#eef8f1;font-size:1rem}.outcome p{margin:5px 0 0}.reason{margin:0;color:#d7e7dc}.empty{padding:24px;text-align:center;color:#bbd1c1}.hidden{display:none}@media(max-width:620px){main{padding-top:28px}}
</style></head><body><main>
<header><p>ECONEST / AUTONOMY ACTIVITY</p><h1>Recommendations, explained.</h1><p>Review what EcoNest considered doing, why it suggested it, and how confident the model was. Recommendations appear here even when actions are disabled.</p></header>
<section id="activity" class="card"><div class="row"><div><h2>Recent recommendations</h2><p id="summary">Loading…</p></div><div class="row"><button id="refresh" class="secondary">Refresh</button><a class="button secondary" href="/command">Command Center</a></div></div><div id="list" class="list"></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=value=>{const n=document.createElement("div");n.textContent=String(value??"");return n.innerHTML};
function formatTime(value){if(!value)return"Time unavailable";const date=new Date(value);return Number.isNaN(date.valueOf())?value:date.toLocaleString("en-US",{month:"2-digit",day:"2-digit",year:"2-digit",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}
function confidence(value){const number=Number(value);return Number.isFinite(number)?`${Math.round(number*100)}% confidence`:"Confidence unavailable"}
async function load(){const list=$("list"),summary=$("summary");summary.textContent="Loading recommendations…";const response=await fetch("/autonomy/recommendations");if(!response.ok)throw Error("Could not load recommendation activity.");const data=await response.json();const items=data.recommendations||[];summary.textContent=items.length?`${items.length} recent recommendation${items.length===1?"":"s"}.`:"No recommendations have been recorded yet.";list.innerHTML=items.length?items.map(item=>{const outcome=item.outcome||{},fallback=item.fallback_reason?`<section class="outcome skipped"><h3>Why fallback policy was used</h3><p>${esc(item.fallback_reason)}</p></section>`:"";return `<article class="item"><div class="row"><h2>${esc(String(item.action).replaceAll("_"," "))}</h2><span class="status">${esc(formatTime(item.timestamp))}</span></div><div class="meta"><span class="tag">${esc(item.entity_id)}</span><span class="tag confidence">${esc(confidence(item.confidence))}</span><span class="tag">${esc(item.risk_level)} risk</span><span class="tag">${esc(item.source)}</span></div><p class="reason">${esc(item.reason)}</p>${fallback}<section class="outcome ${esc(outcome.state||"pending")}"><h3>${esc(outcome.label||"Outcome unavailable")}</h3><p>${esc(outcome.detail||"No outcome details were recorded.")}</p></section></article>`}).join(""):`<div class="empty">Once the autonomy monitor makes a recommendation, it will appear here with its explanation and confidence score.</div>`}
$("refresh").addEventListener("click",()=>load().catch(error=>$("summary").textContent=error.message));load().catch(error=>$("summary").textContent=error.message);
</script></body></html>
