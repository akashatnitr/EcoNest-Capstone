<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoNest Autonomy Activity</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1028;color:#f5f3ff}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#4c277b,#0b1028 58%)}main{width:min(940px,calc(100% - 32px));margin:auto;padding:48px 0 80px}h1{margin:0;font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.04em}p{color:#d4ccf5;line-height:1.5}.card{margin-top:24px;padding:24px;border:1px solid #66528d;border-radius:18px;background:rgba(20,24,59,.92)}button,a.button{border:0;border-radius:9px;padding:11px 15px;background:#c084fc;color:#25113d;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.secondary{background:#303a70;color:#eeeaff}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.status{color:#c4b5fd;font-size:.9rem}.list{display:grid;gap:14px;margin-top:16px}.item{border:1px solid #54477e;border-radius:12px;padding:17px;background:#181d46}.item h2{margin:0;font-size:1.15rem}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tag{padding:4px 8px;border-radius:999px;background:#312a63;color:#e9ddff;font-size:.82rem}.confidence{background:#163f51;color:#c8efff}.outcome{margin:14px 0 0;padding:12px;border-left:4px solid #8b9dc3;background:#202757;border-radius:8px}.outcome.success{border-color:#5eead4}.outcome.failed{border-color:#fb7185;background:#431f3e}.outcome.skipped{border-color:#fbbf24;background:#40311b}.outcome.advisory{border-color:#a78bfa;background:#292354}.outcome h3{margin:0;color:#f5f3ff;font-size:1rem}.outcome p{margin:5px 0 0}.reason{margin:0;color:#eeeaff}.empty{padding:24px;text-align:center;color:#d4ccf5}.hidden{display:none}@media(max-width:620px){main{padding-top:28px}}
</style></head><body><main>
<header><p>ECONEST / RECOMMENDATION ACTIVITY</p><h1>EcoNest Capability</h1><p>You can either request an energy review or see any autonomous activities that have taken place.</p></header>
<section id="activity" class="card"><div class="row"><div><h2>Recent recommendations</h2><p id="summary">Loading…</p></div><div class="row"><button id="runEnergy">Request energy review</button><button id="refresh" class="secondary">Refresh</button></div></div><div id="list" class="list"></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=value=>{const n=document.createElement("div");n.textContent=String(value??"");return n.innerHTML};
function formatTime(value){if(!value)return"Time unavailable";const date=new Date(value);return Number.isNaN(date.valueOf())?value:date.toLocaleString("en-US",{month:"2-digit",day:"2-digit",year:"2-digit",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}
async function load(){const list=$("list"),summary=$("summary");summary.textContent="Loading recommendations…";const response=await fetch("/autonomy/recommendations");if(!response.ok)throw Error("Could not load recommendation activity.");const data=await response.json();const items=data.recommendations||[];summary.textContent=items.length?`${items.length} recent recommendation${items.length===1?"":"s"}.`:"No recommendations have been recorded yet.";list.innerHTML=items.length?items.map(item=>{const outcome=item.outcome||{};return `<article class="item"><div class="row"><h2>${esc(String(item.action).replaceAll("_"," "))}</h2><span class="status">${esc(formatTime(item.timestamp))}</span></div><div class="meta"><span class="tag">${esc(item.entity_id)}</span><span class="tag">${esc(item.risk_level)} risk</span></div><p class="reason">${esc(item.reason)}</p><section class="outcome ${esc(outcome.state||"pending")}"><h3>${esc(outcome.label||"Outcome unavailable")}</h3><p>${esc(outcome.detail||"No outcome details were recorded.")}</p></section></article>`}).join(""):`<div class="empty">Once EcoNest creates a recommendation, it will appear here with its explanation.</div>`}
$("refresh").addEventListener("click",()=>load().catch(error=>$("summary").textContent=error.message));load().catch(error=>$("summary").textContent=error.message);
async function requestEnergyReview(){const summary=$("summary"),button=$("runEnergy");button.disabled=true;summary.textContent="Requesting an energy review…";try{const response=await fetch("/autonomy/energy-recommendations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({})});if(!response.ok)throw Error(await requestError(response));const task=await response.json();await waitForEnergyReview(task.task_id);summary.textContent="Energy recommendations saved to this activity history.";await load()}catch(error){summary.textContent=error.message}finally{button.disabled=false}}
async function requestError(response){if(response.status===404)return"The server has not loaded the energy-review route. Restart the orchestrator, then try again.";try{const body=await response.json();return body.detail||`Could not start the energy review (HTTP ${response.status}).`}catch{return`Could not start the energy review (HTTP ${response.status}).`}}
async function waitForEnergyReview(taskId){for(let attempt=0;attempt<30;attempt+=1){const response=await fetch(`/autonomy/energy-recommendations/${encodeURIComponent(taskId)}`);if(!response.ok)throw Error("Could not check the energy review.");const task=await response.json();if(task.status==="completed")return;if(task.status==="failed")throw Error(task.message||"Energy review failed.");await new Promise(resolve=>setTimeout(resolve,500))}throw Error("Energy review is still running; refresh shortly.")}
$("runEnergy").addEventListener("click",()=>requestEnergyReview());
</script></body></html>
