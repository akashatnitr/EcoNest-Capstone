<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EcoNest Benchmark Report</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0d1323;color:#f6f7ff}body{margin:0;background:#0d1323}main{width:min(1080px,calc(100% - 36px));margin:auto;padding:48px 0 72px}.eyebrow{color:#ae9bff;font-size:.8rem;font-weight:800;letter-spacing:.1em}h1{font-size:clamp(2.3rem,5vw,4rem);letter-spacing:-.05em;margin:10px 0}.lede{color:#c4cde6;line-height:1.6;max-width:780px}.toolbar{display:flex;gap:12px;align-items:center;margin:28px 0}.button{border:0;border-radius:9px;padding:11px 16px;background:#ad96ff;color:#171226;font-weight:800;cursor:pointer}.status{color:#aebbdc;font-size:.92rem}.summary,.grid{display:grid;gap:14px}.summary{grid-template-columns:repeat(3,minmax(0,1fr));margin:24px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section{margin-top:34px}.section>h2{margin:0 0 8px;color:#d7ceff;font-size:1.2rem}.section>p{margin:0 0 14px;color:#bfc9e4;font-size:.92rem}.card{background:#141e33;border:1px solid #40527b;border-radius:14px;padding:19px}.card h2{font-size:1rem;margin:0 0 10px;color:#d7ceff}.card p,.card li{color:#c4cde6;font-size:.92rem;line-height:1.55}.card strong{display:block;font-size:1.55rem;color:#fff;margin:5px 0}.good{color:#6ce3b7!important}.warn{color:#ffd074!important}.verified{color:#6ce3b7;font-size:.8rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}ul{margin:0;padding-left:20px}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:9px 4px;border-bottom:1px solid #314464;vertical-align:top}th{color:#bdb1ff}.detail{margin-top:18px}.detail summary{cursor:pointer;color:#d7ceff;font-weight:800}.detail[open] summary{margin-bottom:14px}.empty{padding:26px;border:1px dashed #40527b;border-radius:14px;color:#bfc9e4}.table-wrap{overflow-x:auto}.nowrap{white-space:nowrap}@media(max-width:760px){main{padding-top:30px}.summary,.grid{grid-template-columns:1fr}}
    </style>
    <link rel="stylesheet" href="/static/econest-theme.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">ECONEST / BENCHMARK REPORT</p>
      <div class="toolbar"><button id="refresh" class="button" type="button">Refresh report</button><span id="status" class="status" role="status" aria-live="polite">Loading local benchmark reports…</span></div>
      <p class="lede">Refresh checks the live EcoNest services and reloads the latest saved report. It does not run a new host benchmark; CPU, memory, power, and response-time figures change only after a new measurement is captured on the EcoNest host.</p>
      <div id="content"></div>
    </main>
    <script>
      const $=id=>document.getElementById(id),esc=value=>String(value??'—').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const fact=(items,label)=>items.find(item=>item.label===label)||{};
      const factCard=(item,fallback)=>`<article class="card"><h2>${esc(item.label||fallback)}</h2><strong>${esc(item.value||'Not measured')}</strong><p>${esc(item.detail||'No measurement is available yet.')}</p></article>`;
      const power=entry=>entry?`${entry.average_watts} W average from ${entry.samples} samples`:'Not captured';
      const seconds=ms=>typeof ms==='number'?`${(ms/1000).toFixed(2)} s`:'Not measured';
      function overview(data,liveHealth){const validation=data.manual_validation||{},facts=validation.configuration||[],comparison=data.cpu_gpu_comparison,health=liveHealth?.services||{},checked=liveHealth!==null,services=checked&&liveHealth.status==='ok'&&health.mysql&&health.arcadedb;const timingCards=comparison?`<article class="card"><h2>Current GPU: first response</h2><strong>${seconds(comparison.backends.gpu.cold?.total_ms)}</strong><p>Cold model-only request after unloading Gemma.</p></article><article class="card"><h2>Current GPU: follow-up response</h2><strong>${seconds(comparison.backends.gpu.warm_median_total_ms)}</strong><p>Median of ${esc(comparison.backends.gpu.warm?.length)} warm model-only requests.</p></article>`:`${factCard(fact(facts,'Earlier CPU cold response'),'Earlier CPU cold response')}${factCard(fact(facts,'Earlier CPU warm response'),'Earlier CPU warm response')}`;return `<section class="summary"><article class="card"><h2>Are the core services ready?</h2><strong class="${services?'good':'warn'}">${services?'Yes':checked?'Needs attention':'Check unavailable'}</strong><p>${checked?'Live check of the orchestrator, MySQL, and ArcadeDB.':'Could not check live services. Saved benchmark results may be out of date.'}</p></article>${timingCards}</section>`}
      function comparisonSection(data){
        const comparison=data.cpu_gpu_comparison;
        if(!comparison)return `<section class="section"><h2>CPU versus GPU</h2><div class="empty">No matched CPU/GPU measurement is saved yet. On the EcoNest host, run <code>python3 scripts/benchmark_ollama_backends.py</code>, then refresh.</div></section>`;
        const cpu=comparison.backends.cpu,gpu=comparison.backends.gpu;
        const measured=comparison.captured_at?new Date(comparison.captured_at).toLocaleString():'unknown time';
        const row=(label,field,format)=>`<tr><td>${esc(label)}</td><td class="nowrap">${esc(format(cpu[field]))}</td><td class="nowrap">${esc(format(gpu[field]))}</td></tr>`;
        const gb=bytes=>typeof bytes==='number'?`${(bytes/1e9).toFixed(2)} GB`:'Not measured';
        const coldRow=`<tr><td>Cold response — model was unloaded first</td><td>${seconds(cpu.cold?.total_ms)}</td><td>${seconds(gpu.cold?.total_ms)}</td></tr>`;
        return `<section class="section"><h2>CPU versus GPU: same Gemma 3 4B prompt</h2>
          <p>Measured ${esc(measured)}. “Cold” means the model had to load into memory; “warm” means it was already loaded. Lower response time is better. This measures Ollama alone, not a full EcoNest answer.</p>
          <div class="card table-wrap"><table><thead><tr><th>Measurement</th><th>Docker CPU</th><th>Native Mac GPU</th></tr></thead><tbody>
          ${coldRow}
          ${row('Warm response — median of repeated requests','warm_median_total_ms',seconds)}
          ${row('Generation speed — warm median','warm_median_tokens_per_second',value=>typeof value==='number'?`${value} tokens/s`:'—')}
          ${row('Ollama-reported loaded model size','loaded_size_bytes',gb)}
          <tr><td>Where the loaded model ran</td><td>${cpu.loaded_gpu_bytes===0?'CPU memory':'Not verified'}</td><td>${gpu.loaded_gpu_bytes===gpu.loaded_size_bytes&&gpu.loaded_size_bytes>0?'100% GPU':'Not verified'}</td></tr>
          </tbody></table></div></section>`;
      }
      function workflowSection(data){
        const comparison=data.workflow_comparison;
        if(!comparison)return `<section class="section"><h2>Complete read-only request</h2><div class="empty">No CPU/GPU workflow test has been saved yet. Run <code>docker exec econest-real-orchestrator poetry run python /app/scripts/benchmark_workflow_backends.py</code> on the host, then refresh.</div></section>`;
        const cpu=comparison.backends.cpu,gpu=comparison.backends.gpu;
        const measured=comparison.captured_at?new Date(comparison.captured_at).toLocaleString():'unknown time';
        const row=(label,field)=>`<tr><td>${esc(label)}</td><td>${seconds(cpu[field])}</td><td>${seconds(gpu[field])}</td></tr>`;
        const modelSuccess=backend=>(backend.samples||[]).filter(sample=>sample.llm_success_count>0).length;
        const cpuSuccess=modelSuccess(cpu),gpuSuccess=modelSuccess(gpu);
        return `<section class="section"><h2>Complete advisory request: CPU versus GPU</h2>
          <p>Measured ${esc(measured)} using the same energy-recommendation question. A temporary, loopback-only EcoNest instance handled each backend with background automation and device actions disabled. The model was preloaded before each request.</p>
          <div class="card table-wrap"><table><thead><tr><th>Stage</th><th>Docker CPU</th><th>Native Mac GPU</th></tr></thead><tbody>
          ${row('Interpret request: direct advisory routing and response','median_interpret_ms')}
          ${row('Agent work: evidence, model, and recommendation','median_agent_run_ms')}
          ${row('Inside agent work: MCP data retrieval','median_mcp_tool_ms')}
          ${row('Inside agent work: Gemma attempt (including failures)','median_llm_ms')}
          ${row('MCP inventory reads (none on this direct advisory route)','median_mcp_resource_ms')}
          ${row('Submit to observed result, with 1-second polling','median_total_to_result_ms')}
          <tr><td>Gemma recommendation completed</td><td>${cpuSuccess}/${esc(cpu.sample_count)}</td><td>${gpuSuccess}/${esc(gpu.sample_count)}</td></tr>
          </tbody></table></div></section>`;
      }
      function browserSection(){
        let sample=null;
        try{sample=JSON.parse(localStorage.getItem('econest_prompt_browser_timing')||'null')}catch{}
        if(!sample||typeof sample.total_to_paint_ms!=='number')return `<section class="section"><h2>Browser timing on this device</h2><div class="empty">No browser sample is saved in this browser yet. Open <a href="/command">User Prompts</a>, submit a read-only question, wait for its result, then return here and refresh. The timing stays in this browser.</div></section>`;
        const ms=value=>typeof value==='number'&&Number.isFinite(value)?`${value.toFixed(1)} ms`:'—';
        const when=sample.captured_at?new Date(sample.captured_at).toLocaleString():'unknown time';
        return `<section class="section"><h2>Browser timing on this device</h2><p>Latest completed prompt in this browser: ${esc(when)} · ${esc(sample.request_kind||'unknown request')}.</p><div class="card table-wrap"><table><thead><tr><th>What the browser observed</th><th>Time</th></tr></thead><tbody><tr><td>Submit to interpretation response</td><td>${esc(ms(sample.interpret_ms))}</td></tr><tr><td>Waiting and polling for the final result</td><td>${esc(ms(sample.result_wait_ms))}</td></tr><tr><td>Approximate render-to-paint wait (two animation frames)</td><td>${esc(ms(sample.paint_estimate_ms))}</td></tr><tr><td>Submit to visible result</td><td>${esc(ms(sample.total_to_paint_ms))}</td></tr></tbody></table></div></section>`;
      }
      function earlierCpuEvidence(data){const facts=data.manual_validation?.configuration||[];return `<section class="section"><h2>Earlier CPU-only evidence</h2><p>These September 2026 figures describe the previous Docker Ollama setup. They are not current GPU memory or whole-system minimum requirements.</p><div class="grid"><article class="card"><h2>Earlier CPU-only full-stack memory</h2><strong>${esc(fact(facts,'Earlier CPU full-stack footprint').value||'Not measured')}</strong><p>${esc(fact(facts,'Earlier CPU full-stack footprint').detail||'No full-stack measurement is available yet.')}</p><p>${esc(fact(facts,'Earlier CPU model footprint').detail||'')}</p></article>${factCard(fact(facts,'Host configuration'),'Test computer')}<article class="card"><h2>Can it run on Linux?</h2><strong>${esc(fact(facts,'Linux deployment posture').value||'Not measured')}</strong><p>${esc(fact(facts,'Linux deployment posture').detail||'')}</p></article>${factCard(fact(facts,'Earlier CPU Gemma throughput'),'Earlier model generation speed')}</div></section>`}
      function weeklyHealthSection(data){const health=data.weekly_health;if(!health)return '';const services=Array.isArray(health.services)?health.services:[],devices=Array.isArray(health.devices)?health.devices:[];const checked=health.checked_at?new Date(health.checked_at).toLocaleString():'unknown time';const status=value=>value==='available'?'good':'warn';return `<section class="section"><h2>Weekly health check</h2><p>Live check completed ${esc(checked)}.</p><div class="grid"><article class="card table-wrap"><h2>Core services</h2><table><thead><tr><th>Service</th><th>Status</th></tr></thead><tbody>${services.map(item=>`<tr><td>${esc(item.name)}</td><td class="${status(item.status)}">${esc(item.status)}</td></tr>`).join('')}</tbody></table></article><article class="card"><h2>Monitored home devices</h2><strong class="${health.attention_devices?'warn':'good'}">${esc(health.available_devices)}/${esc(devices.length)} available</strong><p>${health.attention_devices?`${esc(health.attention_devices)} device${health.attention_devices===1?' needs':'s need'} attention.`:'No monitored devices need attention.'}</p></article></div><div class="card table-wrap"><h2>Device availability</h2><table><thead><tr><th>Device</th><th>Status</th><th>Current state</th></tr></thead><tbody>${devices.map(item=>`<tr><td>${esc(item.name)}</td><td class="${status(item.availability)}">${esc(item.availability)}</td><td>${esc(item.current_state)}</td></tr>`).join('')}</tbody></table></div></section>`}
      function findings(data){const validation=data.manual_validation||{},workflows=validation.workflows||[],cautions=validation.cautions||[],feedback=validation.feedback||[];return `<section class="section"><h2>What has been tested with a user</h2><div class="card"><table><thead><tr><th>Workflow</th><th>Result</th><th>What happened</th></tr></thead><tbody>${workflows.map(item=>`<tr><td>${esc(item.name)}</td><td><span class="verified">${esc(item.status)}</span></td><td>${esc(item.detail)}</td></tr>`).join('')}</tbody></table></div></section>${feedback.length?`<section class="section"><h2>What still needs improvement</h2><div class="card"><table><thead><tr><th>Workflow</th><th>User rating</th><th>Observed gap or policy</th></tr></thead><tbody>${feedback.map(item=>`<tr><td>${esc(item.workflow)}</td><td>${esc(item.rating)}</td><td>${esc(item.detail)}</td></tr>`).join('')}</tbody></table></div></section>`:''}<details class="detail"><summary>Technical details</summary><section class="grid"><article class="card"><h2>Earlier power estimate</h2><p><strong>${esc(power(data.power.idle))}</strong>while idle.</p><p><strong>${esc(power(data.power.warm_command))}</strong>during model work.</p></article><article class="card"><h2>Earlier host storage</h2><p>${esc(data.host?.disk_free_gb)} GB free of ${esc(data.host?.disk_total_gb)} GB total storage.</p><p>${esc(data.host?.cpu_count)} logical CPU cores on ${esc(data.host?.platform)}.</p></article><article class="card"><h2>Earlier container resource snapshot</h2><table><thead><tr><th>Service</th><th>Memory</th><th>CPU</th></tr></thead><tbody>${data.containers.map(item=>`<tr><td>${esc(item.name)}</td><td>${esc(item.memory)}</td><td>${esc(item.cpu)}</td></tr>`).join('')||'<tr><td colspan="3">No container snapshot is available.</td></tr>'}</tbody></table></article><article class="card"><h2>Important measurement notes</h2><ul>${cautions.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></article></section></details>`}
      function render(data,liveHealth){const checkedAt=new Date().toLocaleString();if(!data.available){$('content').innerHTML=`${weeklyHealthSection(data)}<div class="empty">No benchmark reports have been saved yet. Run <code>poetry run python scripts/benchmark_econest.py --label idle</code> on the EcoNest host, then refresh this page.</div>`;$('status').textContent=`Checked ${checkedAt}. No saved benchmark yet.`;return}$('content').innerHTML=`${weeklyHealthSection(data)}${earlierCpuEvidence(data)}${overview(data,liveHealth)}${comparisonSection(data)}${workflowSection(data)}${browserSection()}${findings(data)}`;const capturedAt=data.workflow_comparison?.captured_at||data.cpu_gpu_comparison?.captured_at||data.latest_collected_at,captured=capturedAt?new Date(capturedAt).toLocaleString():'unknown time';$('status').textContent=`Live services checked ${checkedAt}; newest saved measurement ${captured}.`;}
      async function load(){const button=$('refresh');button.disabled=true;$('status').textContent='Checking live services and loading the saved report…';try{const [reportResponse,healthResponse]=await Promise.all([fetch('/benchmarks/api/report',{cache:'no-store'}),fetch('/health',{cache:'no-store'}).catch(()=>null)]);if(!reportResponse.ok)throw Error('Could not load benchmark report.');const report=await reportResponse.json();const liveHealth=healthResponse?.ok?await healthResponse.json():null;render(report,liveHealth)}catch(error){$('status').textContent=error.message}finally{button.disabled=false}}$('refresh').addEventListener('click',load);load();
    </script>
  </body>
</html>
