  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #292823; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

    /* The shared EcoNest theme styles every button as a green control. Room hit areas
       deliberately override that treatment: the apartment itself must stay visible. */
    .cn-obee-plan .room, .casas-aruba-plan .room { border-color: transparent !important; background: transparent !important; box-shadow: none !important; color: #292823 !important; }
    .cn-obee-plan .room:hover, .casas-aruba-plan .room:hover { border-color: rgba(92, 123, 82, .78) !important; background: rgba(222, 239, 215, .12) !important; box-shadow: inset 0 0 0 1px rgba(255,255,255,.72) !important; }
    .cn-obee-plan .room.selected, .casas-aruba-plan .room.selected { border-color: #547f4e !important; background: rgba(214, 233, 206, .16) !important; box-shadow: inset 0 0 0 1px rgba(255,255,255,.8), 0 0 0 3px rgba(115, 151, 104, .22) !important; }

    .plan.standard-plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; aspect-ratio: auto; min-height: 0; padding: 12px; background-image: none; background-color: #eee5d6; }

    /* A faithful HTML reconstruction of the Home I/O mini-map geometry that

    .homeio-plan { aspect-ratio: 4 / 3; min-height: 470px; background: #090a0a; border-color: #302f2a; }
    .homeio-plan::after { z-index: 4; content: "Home I/O · interactive map"; color: rgba(245, 242, 226, .72); }
    .homeio-floor-tabs { position: absolute; z-index: 7; top: 15px; left: 17px; display: flex; gap: 6px; padding: 4px; border: 1px solid rgba(232, 226, 206, .25); border-radius: 10px; background: rgba(15, 18, 16, .8); }
    .homeio-floor-tabs button { padding: 7px 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; box-shadow: none; color: #d8d6cb; font-size: .72rem; font-weight: 800; }

    .homeio-zone-panel .device-row { min-height: 49px; padding: 11px 12px; cursor: default; }
    .homeio-zone-panel .device-row:hover { border-color: #ded7c8; background: #faf8f2; }
    .homeio-zone-panel .device-row.is-control { cursor: pointer; }
    .homeio-zone-panel .device-row.is-control:hover { border-color: #8eaa86; background: #f1f6ed; }
    .device-action { flex: 0 0 auto; min-width: 55px; padding: 5px 8px; border: 1px solid #98af90; border-radius: 7px; background: #e5f0e1; box-shadow: none; color: #31522e; font-size: .72rem; font-weight: 800; }
    .device-action.off { border-color: #d7d0c1; background: #f0ece4; color: #665e52; }
    .temperature-actions { display: inline-flex; align-items: center; gap: 6px; }
    .temperature-actions button { display: grid; width: 28px; height: 28px; padding: 0; place-items: center; border: 1px solid #98af90; border-radius: 7px; background: #e5f0e1; box-shadow: none; color: #31522e; font-size: 1rem; font-weight: 800; line-height: 1; }
    .temperature-actions strong { min-width: 76px; color: #484239; font-size: .76rem; text-align: center; }
    .control-feedback { min-height: 1.1rem; margin: 12px 0 0; color: #496449; font-size: .78rem; font-weight: 700; }
    .control-feedback.error { color: #934d3c; }
    .events ul { display: grid; gap: 8px; margin: 0; padding-left: 18px; }
    .empty { max-width: 620px; margin: 11vh auto; padding: 32px; text-align: center; }
    .empty p { color: #69655b; line-height: 1.5; }
    .scenario-note { color: #69655b; font-size: .83rem; line-height: 1.45; }
    @media (max-width: 980px) { .twin-grid { grid-template-columns: 1fr; } .side { grid-template-columns: repeat(2, minmax(0, 1fr)); } .side > :first-child { grid-column: 1 / -1; } }
    @media (max-width: 680px) { main { padding: 22px 16px; } .plan { min-height: 390px; } .homeio-plan { min-height: 390px; } .room { padding: 4px; } .room-tag { padding: 3px 4px; } .room-name { max-width: 90px; font-size: .6rem; } .reading { padding: 3px 4px; font-size: .57rem; } .homeio-plan .room { padding: 7px; border-width: 2px; } .homeio-plan .room-name { font-size: .7rem; } .homeio-floor-tabs { top: 9px; left: 9px; } .homeio-floor-tabs button { padding: 5px 7px; font-size: .62rem; } .room-flyout { right: 10px; bottom: 10px; width: calc(100% - 20px); max-height: calc(100% - 20px); } .inventory-body, .side { grid-template-columns: 1fr; } .panel-heading { display: grid; } .status-key { justify-content: start; } .homeio-zone-panel .device-list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"><section class="card empty"><h1>Loading digital twin…</h1></section></main>
  <script>
    const icons = { thermostat: "🌡", light: "💡", motion: "◉", door: "▯", power: "⚡", heater: "♨", shade: "▤", smoke: "◉", sensor: "◌", security: "⚿", siren: "⚠" };
    const app = document.querySelector("#app");
    let selectedRoomId = null;
    let flyoutOpen = false;
    let homeIoFloor = "ground";

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
      }[character]));
    }

    function deviceRows(data, roomId, interactive = true) {
      const devices = data.devices.filter(device => device.room === roomId);
      if (!devices.length) return '<p class="device-detail">No modeled devices in this room.</p>';
      const currentValue = device => {
        if (device.kind === "thermostat") return device.detail.match(/([\d.]+°F)/)?.[1] || device.detail.split(" · ")[0];
        if (device.kind === "power") return device.detail.match(/([\d.]+ W)/)?.[1] || device.detail.split(" · ")[0];
        return device.detail.split(" · ")[0];
      };
      return `<div class="device-list">${devices.map(device => `
        <${interactive ? "button" : "div"} class="device-row" ${interactive ? `type="button" data-device="${escapeHtml(device.id)}" aria-label="${escapeHtml(device.label)}: ${escapeHtml(currentValue(device))}"` : `role="group" aria-label="${escapeHtml(device.label)}: ${escapeHtml(currentValue(device))}"`}>
          <span class="device-primary"><span class="device-icon">${icons[device.kind] || "•"}</span><strong>${escapeHtml(device.label)}</strong></span>
          <span class="device-state ${device.state === "idle" || device.state === "off" ? "idle" : ""}">${escapeHtml(currentValue(device))}</span>
        </${interactive ? "button" : "div"}>`).join("")}</div>`;
    }

    function homeIoDeviceRows(data, roomId) {
      const devices = data.devices.filter(device => device.room === roomId);
      if (!devices.length) return '<p class="device-detail">No modeled devices in this zone.</p>';
      const detailValue = device => device.detail.split(" · ")[0];
      return `<div class="device-list">${devices.map(device => {
        const icon = icons[device.kind] || "•";
        const identity = `<span class="device-primary"><span class="device-icon">${icon}</span><strong>${escapeHtml(device.label)}</strong></span>`;
        if (device.temperature_control) {
          return `<div class="device-row is-control" role="group" aria-label="${escapeHtml(device.label)} ${escapeHtml(detailValue(device))}">${identity}<span class="temperature-actions"><button type="button" data-temperature-delta="-1" data-device-temperature="${escapeHtml(device.id)}" aria-label="Lower ${escapeHtml(device.label)}">−</button><strong>${escapeHtml(detailValue(device))}</strong><button type="button" data-temperature-delta="1" data-device-temperature="${escapeHtml(device.id)}" aria-label="Raise ${escapeHtml(device.label)}">+</button></span></div>`;
        }
        if (device.live_writable && device.momentary) {
          return `<div class="device-row is-control" role="group">${identity}<button class="device-action" type="button" data-device-pulse="${escapeHtml(device.id)}">Trigger</button></div>`;
        }
        if (device.live_writable) {
          const on = device.state === "on";
          return `<button class="device-row is-control" type="button" data-device-toggle="${escapeHtml(device.id)}" data-next-state="${on ? "off" : "on"}" aria-label="Turn ${on ? "off" : "on"} ${escapeHtml(device.label)}">${identity}<span class="device-action ${on ? "" : "off"}">${on ? "On" : "Off"}</span></button>`;
        }
        return `<div class="device-row" role="group" aria-label="${escapeHtml(device.label)}: ${escapeHtml(detailValue(device))}">${identity}<span class="device-state ${device.state === "idle" || device.state === "off" ? "idle" : ""}">${escapeHtml(detailValue(device))}</span></div>`;
      }).join("")}</div>`;
    }

    function supportsManualControls(data) {
      return data.name === "CASAS Aruba Replay" || data.name === "CN-OBEE Beijing Apartment" || data.name === "Home I/O Interactive Test Home";
    }

    function manualControlPanel(data) {
      const isSupported = supportsManualControls(data);
      if (!isSupported) return "";
      const datasetName = data.name === "CASAS Aruba Replay" ? "CASAS" : data.name === "CN-OBEE Beijing Apartment" ? "CN-OBEE" : "Home I/O demo";
      const rooms = data.rooms.map(room => {
        const devices = data.devices.filter(device => device.room === room.id);
        const isHomeIO = data.name === "Home I/O Interactive Test Home";
        const controllable = isHomeIO ? devices.filter(device => device.live_writable) : devices;
        const controls = controllable.map(device => {
          if (isHomeIO && device.momentary) return `<div class="manual-device"><span>${icons[device.kind] || "•"} ${escapeHtml(device.label)}</span><button type="button" data-device-pulse="${escapeHtml(device.id)}">Trigger</button></div>`;
          if (isHomeIO) return `<label class="manual-device"><span>${icons[device.kind] || "•"} ${escapeHtml(device.label)}</span><select data-device-state="${escapeHtml(device.id)}"><option value="on" ${device.state === "on" ? "selected" : ""}>On</option><option value="off" ${device.state !== "on" ? "selected" : ""}>Off</option></select></label>`;
          return `<label class="manual-device"><span>${icons[device.kind] || "•"} ${escapeHtml(device.label)}</span><select data-device-state="${escapeHtml(device.id)}"><option value="normal" ${device.state === "normal" ? "selected" : ""}>Normal</option><option value="active" ${device.state === "active" ? "selected" : ""}>Active</option><option value="idle" ${device.state === "idle" ? "selected" : ""}>Idle</option><option value="on" ${device.state === "on" ? "selected" : ""}>On</option><option value="off" ${device.state === "off" ? "selected" : ""}>Off</option></select></label>`;
        }).join("");
        const residentControl = data.name === "Home I/O Interactive Test Home" ? "" : `<button class="manual-room-action" type="button" data-place-resident="${escapeHtml(room.id)}">Move resident here</button>`;
        return `<details class="manual-room"><summary><span>${escapeHtml(room.name)}</span><small>${controllable.length} control${controllable.length === 1 ? "" : "s"}</small></summary><div class="manual-room-body">${residentControl}<div class="manual-device-list">${controls || '<p class="device-detail">No controllable outputs in this zone.</p>'}</div></div></details>`;
      }).join("");
      const boundary = data.name === "Home I/O Interactive Test Home"
        ? (data.bridge?.connected ? "Live bridge connected: controls here send only to the blue External-Mode Home I/O devices. Shade, garage, and security actions are short pulses." : "The live Home I/O desktop bridge is unavailable; no simulator action can be sent.")
        : `These controls change only this ${datasetName} simulation. Recorded source data is unchanged.`;
      return `<details id="manualSimulationPanel" class="manual-simulation-panel"><summary>Manual simulation controls</summary><div class="manual-simulation-body"><p>${boundary}</p><div class="manual-toolbar"><button type="button" data-place-resident="away">Set resident away</button></div><div class="manual-room-list">${rooms}</div></div></details>`;
    }

    async function applyManualOverride(data, body) {
      const response = await fetch("/simulation/override", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ household_id: data.household_id, ...body }),
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.detail || "Home I/O did not accept that control.");
      }
      const updated = await response.json();
      window.simulationScenarioFeedback = "Manual simulation override applied.";
      render(updated);
    }

    function showHomeIoFeedback(message, error = false) {
      const feedback = document.querySelector("#homeIoControlFeedback");
      if (!feedback) return;
      feedback.textContent = message;
      feedback.classList.toggle("error", error);
    }

    function setFlyoutVisible(open) {
      const flyout = document.querySelector("#roomFlyout");
      if (!flyout) return;
      flyoutOpen = open;
      if (open) {
        flyout.hidden = false;
        requestAnimationFrame(() => flyout.classList.add("open"));
        document.querySelector("#flyoutClose")?.focus();
        return;
      }
      flyout.classList.remove("open");
      window.setTimeout(() => { if (!flyoutOpen) flyout.hidden = true; }, 210);
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") setFlyoutVisible(false);
    });

    function selectRoom(data, roomId, openFlyout = false) {
      selectedRoomId = roomId;
      const room = data.rooms.find(item => item.id === roomId);
      if (!room) return;
      document.querySelectorAll("[data-room]").forEach(button => {
        button.classList.toggle("selected", button.dataset.room === roomId);
        if (button.matches(".zone-picker button")) button.setAttribute("aria-pressed", String(button.dataset.room === roomId));
      });
      document.querySelector("#detailTitle").textContent = room.name;
      document.querySelector("#detailText").textContent = `${room.occupied ? "Occupancy recorded" : "No occupancy recorded"} · ${room.temperature_f}°F in this replay interval.`;
      const displayOnly = data.name === "Home I/O Interactive Test Home";
      document.querySelector("#deviceList").innerHTML = displayOnly
        ? homeIoDeviceRows(data, roomId)
        : deviceRows(data, roomId, true);
      if (displayOnly) bindHomeIoControls(data);
      else bindDeviceDetails(data);
      if (openFlyout && document.querySelector("#roomFlyout")) setFlyoutVisible(true);
    }

    function bindManualControls(data) {
      if (!supportsManualControls(data)) return;
      document.querySelectorAll("[data-place-resident]").forEach(control => {
        control.addEventListener("click", event => {
          applyManualOverride(data, { resident_room: event.currentTarget.dataset.placeResident }).catch(() => {});
        });
      });
      document.querySelectorAll("[data-device-state]").forEach(control => {
        control.addEventListener("change", event => {
          applyManualOverride(data, { device_id: event.target.dataset.deviceState, device_state: event.target.value }).catch(() => {});
        });
      });
      document.querySelectorAll("[data-device-pulse]").forEach(control => {
        control.addEventListener("click", event => {
          applyManualOverride(data, { device_id: event.currentTarget.dataset.devicePulse, device_state: "trigger" }).catch(() => {});
        });
      });
    }

    function bindHomeIoControls(data) {
      if (data.name !== "Home I/O Interactive Test Home") return;
      document.querySelectorAll("[data-device-toggle]").forEach(control => {
        control.addEventListener("click", event => {
          applyManualOverride(data, { device_id: event.currentTarget.dataset.deviceToggle, device_state: event.currentTarget.dataset.nextState }).catch(error => showHomeIoFeedback(error.message, true));
        });
      });
      document.querySelectorAll("[data-device-pulse]").forEach(control => {
        control.addEventListener("click", event => {
          applyManualOverride(data, { device_id: event.currentTarget.dataset.devicePulse, device_state: "trigger" }).catch(error => showHomeIoFeedback(error.message, true));
        });
      });
      document.querySelectorAll("[data-device-temperature]").forEach(control => {
        control.addEventListener("click", event => {
          applyManualOverride(data, { device_id: event.currentTarget.dataset.deviceTemperature, temperature_delta: Number(event.currentTarget.dataset.temperatureDelta) }).catch(error => showHomeIoFeedback(error.message, true));
        });
      });
    }

    function bindDeviceDetails(data) {
      document.querySelectorAll("[data-device]").forEach(button => {
        button.addEventListener("click", () => {
          const device = data.devices.find(item => item.id === button.dataset.device);
          const room = data.rooms.find(item => item.id === device?.room);
          if (!device) return;
          document.querySelector("#detailTitle").textContent = device.label;
          document.querySelector("#detailText").textContent = `${device.detail}${room ? ` · ${room.name}.` : ""}`;
        });
      });
    }

    function render(data) {
      if (!data.available) {
        app.innerHTML = `<section class="card empty"><p class="eyebrow">SIMULATED HOUSEHOLD</p><h1>Choose a simulation</h1><p>${escapeHtml(data.message)}</p></section>`;
        return;
      }
      const overview = data.dataset_overview || {};
      const live = data.live_simulation || {};
      const defaultRoom = data.rooms.find(room => room.occupied)?.id || data.rooms[0]?.id;
      selectedRoomId = data.rooms.some(room => room.id === selectedRoomId) ? selectedRoomId : defaultRoom;
      const isCnObee = data.name === "CN-OBEE Beijing Apartment";
      const isCasasAruba = data.name === "CASAS Aruba Replay";
      const isHomeIO = data.name === "Home I/O Interactive Test Home";
      const usesCutaway = isCnObee || isCasasAruba;
      const usesFloorplan = usesCutaway;
      const liveLightSummary = data.devices
        .filter(device => device.kind === "light")
        .map(device => `${device.label}: ${device.state === "on" ? "ON" : "OFF"}`)
        .join(" · ");
      const liveHomeIO = data.name === "Home I/O Interactive Test Home" && data.bridge?.connected
        ? `<section class="live-homeio" aria-live="polite"><strong>● Live Home I/O connected</strong><span>${escapeHtml(liveLightSummary)}. Synced from the Windows simulator every 5 seconds.</span></section>`
        : "";
      const homeIOPreview = data.name === "Home I/O Interactive Test Home" && data.bridge?.connected
        ? `<figure class="homeio-preview"><img id="homeIOPreview" src="/simulation/home-io-preview?household_id=${encodeURIComponent(data.household_id)}&t=${Date.now()}" alt="Current private preview of the Home I/O simulator" /><figcaption>Live Home I/O desktop preview · refreshes every 5 seconds</figcaption></figure>`
        : "";
      flyoutOpen = false;
      const visualOverlays = data.visual_overlays || {};
      const casasAway = isCasasAruba && visualOverlays.car_present === false;
      const residentRoom = String(visualOverlays.resident_room || "front_entry").replaceAll("_", "-");
      const residentOverlay = (isCasasAruba || isCnObee) && visualOverlays.resident_visible
        ? `<img class="resident-overlay resident-in-${escapeHtml(residentRoom)}" src="/static/assets/casas-resident-arriving.png" alt="Resident represented in ${escapeHtml(String(visualOverlays.resident_room || "front entry").replaceAll("_", " "))}, based on the active motion-sensor room" />`
        : "";
      const homeIoRoomFloor = { living_room: "ground", entry: "ground", kitchen: "ground", garage: "ground", bedroom: "first", bathroom: "first" };
      const rooms = data.rooms.map(room => `
        <button class="room room-${escapeHtml(room.id).replaceAll("_", "-")} ${isHomeIO ? `homeio-${homeIoRoomFloor[room.id] || "ground"}` : ""} ${room.occupied ? "active" : ""}" type="button" data-room="${escapeHtml(room.id)}" aria-label="Inspect ${escapeHtml(room.name)}. ${room.occupied ? "Activity recorded" : "Quiet"}. ${room.temperature_f} degrees Fahrenheit.">
          <span class="room-tag"><span class="occupancy-dot" aria-hidden="true"></span><span class="room-name">${escapeHtml(room.name)}</span></span>
          <span class="room-readings"><span class="reading">${room.temperature_f}°F</span><span class="reading">${room.occupied ? "Activity" : "Quiet"}</span></span>
        </button>`).join("");
      const inventoryTitle = data.source?.kind === "simulator" ? "Simulator inventory" : "Dataset inventory";
      const homeIoFloorControls = "";
      const homeIoMap = rooms;
      const selectedRoom = data.rooms.find(room => room.id === selectedRoomId);
      const homeIoZonePanel = isHomeIO && selectedRoom ? `<section class="card homeio-zone-panel"><div class="panel-heading"><div><h2>Home I/O zones</h2><p>Select a lettered zone, then control its available live devices directly.</p></div><div class="status-key"><span>Live bridge state</span><span>Blue devices are controllable</span></div></div><div class="zone-picker" role="group" aria-label="Home I/O zones">${data.rooms.map(room => `<button type="button" data-room="${escapeHtml(room.id)}" class="${room.id === selectedRoomId ? "selected" : ""}" aria-pressed="${room.id === selectedRoomId}">${escapeHtml(room.name)}</button>`).join("")}</div><div class="zone-summary"><h2 id="detailTitle">${escapeHtml(selectedRoom.name)}</h2><p id="detailText">${selectedRoom.occupied ? "Motion detected" : "No occupancy recorded"} · ${selectedRoom.temperature_f}°F in this simulator zone.</p></div><div id="deviceList">${homeIoDeviceRows(data, selectedRoomId)}</div><p id="homeIoControlFeedback" class="control-feedback" aria-live="polite"></p></section>` : "";
      const inventory = data.dataset_overview ? `<details class="inventory card"><summary>${inventoryTitle}</summary><div class="inventory-body">
        <div class="inventory-item"><strong>Coverage</strong>${escapeHtml(overview.coverage || "—")}</div>
        <div class="inventory-item"><strong>Source range</strong>${escapeHtml(overview.source_range || "—")}</div>
        <div class="inventory-item"><strong>Signals</strong>${escapeHtml(overview.signals || overview.sensors || "—")}</div>
        <div class="inventory-item"><strong>Replay note</strong>${escapeHtml(overview.replay_note || "—")}</div>
      </div></details>` : "";
      app.innerHTML = `
        <p class="eyebrow">ECONEST / DIGITAL TWIN</p>
        <h1>${escapeHtml(data.name)}</h1>
        <p class="intro">${escapeHtml(data.subtitle)}. Explore a room to see its recorded readings and modeled devices. Controls apply only to this safe simulation.</p>
        ${data.source ? `<p class="source-line">Dataset: <a href="${escapeHtml(data.source.url)}" target="_blank" rel="noreferrer">${escapeHtml(data.source.name)}</a> · ${escapeHtml(data.source.license)}</p>` : ""}
        <div class="live-strip"><div class="live-chip"><span>Simulated now</span><strong id="liveClock">${escapeHtml(live.clock || "—")}</strong></div><div class="live-chip"><span>Current state</span><strong>${escapeHtml(live.activity || data.summary.occupancy)}</strong></div><div class="live-chip"><span>Mode</span><strong>${escapeHtml(data.bridge?.mode || live.mode || "Simulation")}</strong></div></div>
        ${liveHomeIO}
        ${homeIOPreview}
        ${inventory}
        <div class="twin-grid ${isHomeIO ? "homeio-layout" : ""}">${isHomeIO ? homeIoZonePanel : `<section class="card home-panel"><div class="panel-heading"><div><h2>${usesCutaway ? "Interactive home" : "Room overview"}</h2><p>${escapeHtml(data.updated_label)}</p></div><div class="status-key"><span>● Activity recorded</span><span>○ Quiet</span><span>Click any room</span></div></div>${usesFloorplan ? `<p class="plan-note">This is an illustrative cutaway based on ${isCnObee ? "CN-OBEE’s documented rooms" : "CASAS Aruba’s documented sensor zones"}. Select a room to inspect its source-backed replay readings and modeled devices.</p>` : ""}<div class="plan ${isCnObee ? "cn-obee-plan" : isCasasAruba ? "casas-aruba-plan" : "standard-plan"} ${casasAway ? "resident-away" : ""}" role="group" aria-label="${usesFloorplan ? `Interactive ${escapeHtml(data.name)} home layout` : "Interactive room overview"}">${residentOverlay}${homeIoMap}${usesCutaway ? '<section id="roomFlyout" class="room-flyout" hidden aria-live="polite"><div class="flyout-heading"><h3 id="detailTitle">Room details</h3><button id="flyoutClose" class="flyout-close" type="button" aria-label="Close room details">×</button></div><p id="detailText" class="detail-subtitle">Select a room to inspect its readings and devices.</p><div id="deviceList"></div></section>' : ""}</div>${manualControlPanel(data)}</section>`}${isHomeIO ? "" : `<aside class="side"><section class="card metrics"><h3>At a glance</h3><div class="metric"><span>Occupancy</span><strong>${escapeHtml(data.summary.occupancy)}</strong></div><div class="metric"><span>Indoor temperature</span><strong>${data.summary.indoor_temperature_f}°F</strong></div><div class="metric"><span>Power now</span><strong>${data.summary.power_w} W</strong></div><div class="metric"><span>Active rooms</span><strong>${data.summary.active_rooms}</strong></div></section>${usesCutaway ? "" : '<section class="card detail"><h3 id="detailTitle">Room details</h3><p id="detailText" class="detail-subtitle">Select a room to inspect its readings and devices.</p><div id="deviceList"></div></section>'}<section class="card events"><h3>Recent replay events</h3><ul>${data.events.map(event => `<li>${escapeHtml(event)}</li>`).join("")}</ul></section></aside>`}</div>`;
      document.querySelectorAll("[data-room]").forEach(button => button.addEventListener("click", () => selectRoom(data, button.dataset.room, usesCutaway)));
      document.querySelector("#flyoutClose")?.addEventListener("click", () => setFlyoutVisible(false));
      bindManualControls(data);
      bindHomeIoControls(data);
      selectRoom(data, selectedRoomId);
    }

    window.render = render;
    async function loadTwin() {
      const active = await fetch("/auth/active-household", { cache: "no-store" });
      if (!active.ok) throw new Error("No active household");
      const household = await active.json();
      const selected = household?.id ? `?household_id=${encodeURIComponent(household.id)}` : "";
      const response = await fetch(`/simulation/state${selected}`, { cache: "no-store" });
      if (!response.ok) throw new Error("Simulation unavailable");
      return response.json();
    }
    loadTwin().then(render).catch(() => render({ available: false, message: "The simulated home could not be loaded. Refresh and try again." }));
    window.setInterval(async () => {
      if (flyoutOpen) return;
      try {
        const state = await loadTwin();
        render(state);
      } catch { /* Keep the last known simulated time until the next refresh. */ }
    }, 5_000);
  </script>
  <script src="/static/simulation-controls.js?v=4"></script>
</body>
</html>
