<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoNest Learned Insights</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0d1323;color:#f6f7ff}body{margin:0;min-height:100vh;background:#0d1323}main{width:min(1200px,calc(100% - 32px));margin:auto;padding:44px 0 80px}header>p:first-child{color:#a995ff;letter-spacing:.06em}h1{font-size:clamp(2.2rem,5vw,3.65rem);letter-spacing:-.05em;margin:0}h2,h3{margin:0}p{color:#cbd2e9;line-height:1.55}.lede{max-width:780px;font-size:1.05rem}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 20px}.status{color:#aebce0;margin:0}.model-briefing{display:none;margin:0 0 22px;padding:20px 22px;border:1px solid #8068bd;border-radius:15px;background:#1b1934;box-shadow:inset 4px 0 #b99aff}.model-briefing.visible{display:block}.model-briefing h2{color:#fff;font-size:1.15rem}.model-briefing p{white-space:pre-wrap;margin:10px 0 0}.model-briefing small{display:block;color:#bdb2df;margin-top:12px}.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}.metric{padding:16px;border:1px solid #3d5079;border-radius:12px;background:#111a2d}.metric span{display:block;color:#a9b9dd;font-size:.87rem}.metric strong{display:block;color:#b9a6ff;font-size:1.55rem;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.insight{border:1px solid #455981;border-radius:15px;padding:21px;background:#131c30;box-shadow:inset 4px 0 #9985e8}.insight.learned{box-shadow:inset 4px 0 #65dec4}.insight.observed{box-shadow:inset 4px 0 #77b7f7}.insight.needs_data,.insight.needs_setup{box-shadow:inset 4px 0 #efc46b}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.category{color:#bbaaff;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;font-weight:750}.tag{padding:5px 8px;border-radius:999px;background:#2b3b60;color:#dce7ff;font-size:.78rem;white-space:nowrap}.learned .tag{background:#16473f;color:#c8ffeb}.observed .tag{background:#1b4267;color:#d7efff}.needs_data .tag,.needs_setup .tag{background:#4c3b1e;color:#ffedbb}.headline{font-size:1.18rem;color:#fff;margin:14px 0 8px}.confidence{margin:14px 0 0;color:#9fd2fb;font-weight:650}.confidence.zero{color:#f3ca70}.next{margin:14px 0 0;padding:12px;border-radius:9px;background:#202d49;color:#e2e8ff}.notice{margin-top:20px;padding:16px;border-left:4px solid #a995ff;border-radius:9px;background:#1c2741;color:#dfe7ff}button{border:0;border-radius:9px;padding:11px 15px;background:#af91ff;color:#160d32;font:inherit;font-weight:750;cursor:pointer;box-shadow:0 3px 0 #7656cb}button.secondary{background:#354a76;color:#edf4ff;box-shadow:none}.empty{padding:28px;text-align:center;color:#b5c1df}@media(max-width:760px){.overview,.grid{grid-template-columns:1fr}main{padding-top:28px}}
</style></head><body><main>
<header><h1>Analytics dashboard</h1></header>
<div class="bar"><button id="refresh">Refresh insights</button><button id="explain" class="secondary">Ask Gemma to explain</button><a href="/autonomy"><button class="secondary">Recommendation activity</button></a><p id="status" class="status">Loading learned insights…</p></div>
<section id="model-briefing" class="model-briefing" aria-live="polite"><h2>Gemma’s analytics explanation</h2><p id="model-text"></p><small id="model-source"></small></section>
<section id="insights" class="grid" aria-live="polite"></section>
<section class="overview"><article class="metric"><span>Raw evidence retained</span><strong id="raw">—</strong><span>Home Assistant state history</span></article><article class="metric"><span>Energy analytics history</span><strong id="window">—</strong><span>Hourly long-term statistics and current readings</span></article><article class="metric"><span>Analytics sources</span><strong id="sources">—</strong><span>Power or energy reporting sources</span></article></section>
</main><script>
const $=id=>document.getElementById(id);const esc=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};const n=v=>Number(v||0).toLocaleString('en-US');
function card(item){const state=String(item.state||'needs_data');return `<article class="insight ${esc(state)}"><div class="top"><span class="category">${esc(item.category)}</span><span class="tag">${esc(state.replace('_',' '))}</span></div><h2 class="headline">${esc(item.headline)}</h2><p>${esc(item.detail)}</p><p class="next"><strong>Next:</strong> ${esc(item.next_step)}</p></article>`}
async function load(){const [summaryResponse,insightResponse]=await Promise.all([fetch('/analytics/api/summary'),fetch('/analytics/api/insights')]);if(!summaryResponse.ok||!insightResponse.ok)throw Error('Could not load learned insights.');const summary=await summaryResponse.json(),data=await insightResponse.json();$('raw').textContent=n(summary.raw_readings);$('window').textContent=summary.analytics_start?`Since ${new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(summary.analytics_start))}`:'Not built';$('sources').textContent=n(summary.measured_devices);const items=data.insights||[];$('insights').innerHTML=items.length?items.map(card).join(''):'<div class="empty">No learned insights are available yet.</div>';$('status').textContent='Insights refreshed.'}
$('refresh').onclick=()=>{ $('status').textContent='Refreshing…';load().catch(error=>$('status').textContent=error.message)};load().catch(error=>$('status').textContent=error.message);
$('explain').onclick=async()=>{const button=$('explain');button.disabled=true;$('status').textContent='Gemma is reviewing the calculated evidence…';try{const response=await fetch('/analytics/api/model-explanation',{method:'POST'}),data=await response.json();if(!response.ok)throw Error(data.detail||'Could not generate a model explanation.');$('model-text').textContent=data.narrative;$('model-source').textContent=`Generated by ${data.source} from the current calculated analytics evidence.`;$('model-briefing').classList.add('visible');$('status').textContent='Gemma explanation generated.'}catch(error){$('status').textContent=error.message}finally{button.disabled=false}};
</script></body></html>
