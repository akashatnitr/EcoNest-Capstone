# Real EcoNest orchestrator stack for the Mac demo environment.
#
# This stack is intentionally separate from the existing Home Assistant
# container. It connects to Home Assistant at http://host.docker.internal:8123
# and reads HA_TOKEN from the ignored local .env file.
#
# Usage:
#   Add HA_TOKEN=your_home_assistant_token to .env
#   docker compose -f docker-compose.real.yml up -d --build
#   docker compose -f docker-compose.real.yml down

name: econest-real

services:
  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: econest-real-arcadedb
    ports:
      - "2480:2480"
      - "2425:2424"
    environment:
      ARCADEDB_USER: ${ARCADEDB_USER:-root}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:-playwithdata}
      ARCADEDB_SETTINGS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-playwithdata}
        -Darcadedb.server.defaultDatabases=${ARCADEDB_DATABASE:-econest}[${ARCADEDB_USER:-root}:${ARCADEDB_PASSWORD:-playwithdata}:admin]
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "--header",
          "Authorization: Basic $$(printf '%s:%s' \"$$ARCADEDB_USER\" \"$$ARCADEDB_PASSWORD\" | base64)",
          "http://localhost:2480/api/v1/server",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: econest-real-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: econest
      MYSQL_DATABASE: econest
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database_schema.txt:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/migrate_add_users.sql:/docker-entrypoint-initdb.d/02-users.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-peconest"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: econest-real-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # Gemma 3 4B fits only when a single inference runner owns the Docker
      # memory budget.  The orchestrator also serializes requests.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
    entrypoint: ["ollama", "serve"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: econest-real-orchestrator
    env_file:
      - .env
    ports:
      - "8001:8000"
    environment:
      ARCADEDB_HOST: arcadedb
      ARCADEDB_PORT: 2480
      ARCADEDB_USER: ${ARCADEDB_USER:?Set ARCADEDB_USER in your .env}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD:?Set ARCADEDB_PASSWORD in your .env}
      ARCADEDB_DATABASE: econest
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: econest
      MYSQL_DATABASE: econest
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      HA_URL: ${HA_URL:-http://host.docker.internal:8123}
      HA_TOKEN: ${HA_TOKEN:?Set HA_TOKEN in your .env before starting econest-real}
      HA_REGISTRY_SOURCE: ${HA_REGISTRY_SOURCE:-live}
      HA_INGEST_ENABLED: ${HA_INGEST_ENABLED:-true}
      HA_INGEST_INTERVAL_SECONDS: ${HA_INGEST_INTERVAL_SECONDS:-60}
      HA_REGISTRY_REFRESH_SECONDS: ${HA_REGISTRY_REFRESH_SECONDS:-300}
      GRAPH_SYNC_ENABLED: ${GRAPH_SYNC_ENABLED:-true}
      GRAPH_SYNC_INTERVAL_SECONDS: ${GRAPH_SYNC_INTERVAL_SECONDS:-300}
      DEVICE_CAPABILITY_FAIL_CLOSED: ${DEVICE_CAPABILITY_FAIL_CLOSED:-true}
      SECRET_KEY: ${SECRET_KEY:-replace-this-for-local-demo-only}
      AUDIT_LOG_MAX_BYTES: ${AUDIT_LOG_MAX_BYTES:-10485760}
      AUDIT_LOG_BACKUP_COUNT: ${AUDIT_LOG_BACKUP_COUNT:-5}
      AUTONOMY_MONITOR_ENABLED: ${AUTONOMY_MONITOR_ENABLED:-true}
      AUTONOMY_MONITOR_INTERVAL_SECONDS: ${AUTONOMY_MONITOR_INTERVAL_SECONDS:-300}
      AUTONOMY_MONITOR_RUN_ON_STARTUP: ${AUTONOMY_MONITOR_RUN_ON_STARTUP:-true}
      AUTONOMY_ACTIONS_ENABLED: ${AUTONOMY_ACTIONS_ENABLED:-true}
      AUTONOMY_ACTION_CONFIDENCE_THRESHOLD: ${AUTONOMY_ACTION_CONFIDENCE_THRESHOLD:-0.85}
      AUTONOMY_ALLOWED_ACTIONS: ${AUTONOMY_ALLOWED_ACTIONS:-light.turn_off,light.turn_on}
      AUTONOMY_ALLOWED_ENTITIES: ${AUTONOMY_ALLOWED_ENTITIES:-light.upstairs_media_light_1}
    depends_on:
      arcadedb:
        condition: service_healthy
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c 'poetry install --no-interaction && poetry run poe dev'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      # CPU inference can briefly delay Python while Gemma 3 is responding.
      timeout: 15s
      retries: 5

volumes:
  arcadedb-data:
  mysql-data:
  ollama-data:
