# Real EcoNest orchestrator stack for the Mac demo environment.
#
# This stack is intentionally separate from the existing Home Assistant
# container. It connects to Home Assistant at http://host.docker.internal:8123
# and reads HA_TOKEN from the ignored local .env file.
#
# Usage:
#   Add HA_TOKEN=your_home_assistant_token to .env
#   docker compose -f docker-compose.real.yml up -d --build
#   docker compose -f docker-compose.real.yml down

name: econest-real

services:
  arcadedb:
    image: arcadedata/arcadedb:latest
    container_name: econest-real-arcadedb
    ports:
      - "2481:2480"
      - "2425:2424"
    environment:
      JAVA_OPTS: "-Darcadedb.server.rootPassword=playwithdata"
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "--header",
          "Authorization: Basic cm9vdDpwbGF5d2l0aGRhdGE=",
          "http://localhost:2480/api/v1/server",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: econest-real-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: econest
      MYSQL_DATABASE: econest
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database_schema.txt:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/migrate_add_users.sql:/docker-entrypoint-initdb.d/02-users.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-peconest"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: econest-real-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["ollama", "serve"]

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: econest-real-orchestrator
    env_file:
      - .env
    ports:
      - "8001:8000"
    environment:
      ARCADEDB_HOST: arcadedb
      ARCADEDB_PORT: 2480
      ARCADEDB_USER: root
      ARCADEDB_PASSWORD: playwithdata
      ARCADEDB_DATABASE: econest
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: econest
      MYSQL_DATABASE: econest
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen2.5:0.5b}
      HA_URL: http://host.docker.internal:8123
      HA_TOKEN: ${HA_TOKEN:?Set HA_TOKEN in your .env before starting econest-real}
      HA_REGISTRY_SOURCE: ${HA_REGISTRY_SOURCE:-live}
      SECRET_KEY: ${SECRET_KEY:-replace-this-for-local-demo-only}
      AUDIT_LOG_MAX_BYTES: ${AUDIT_LOG_MAX_BYTES:-10485760}
      AUDIT_LOG_BACKUP_COUNT: ${AUDIT_LOG_BACKUP_COUNT:-5}
      AUTONOMY_MONITOR_ENABLED: ${AUTONOMY_MONITOR_ENABLED:-true}
      AUTONOMY_MONITOR_INTERVAL_SECONDS: ${AUTONOMY_MONITOR_INTERVAL_SECONDS:-300}
      AUTONOMY_MONITOR_RUN_ON_STARTUP: ${AUTONOMY_MONITOR_RUN_ON_STARTUP:-true}
      AUTONOMY_ACTIONS_ENABLED: ${AUTONOMY_ACTIONS_ENABLED:-false}
    depends_on:
      arcadedb:
        condition: service_healthy
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - .:/app
    command: >
      sh -c 'poetry install --no-interaction && poetry run poe dev'

volumes:
  arcadedb-data:
  mysql-data:
  ollama-data:
